name: Build, Push and Deploy HR Enterprise

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # CI GATE 1: BACKEND CI (Test & Build)
  # ==========================================
  ci-backend:
    name: Backend CI (Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run Backend Tests (Includes Build)
        run: cd backend && npm test

  # ==========================================
  # CI GATE 2: FRONTEND CI (Lint, Test & Build)
  # ==========================================
  ci-frontend:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Run Frontend Tests
        run: cd frontend && npm test

      - name: Build Frontend Application
        run: cd frontend && npm run build

  # ==========================================
  # CD JOB 1: BUILD & PUSH BACKEND DOCKER IMAGE
  # ==========================================
  build-and-push-backend:
    name: Build & Push Backend
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD JOB 2: BUILD & PUSH FRONTEND DOCKER IMAGE
  # ==========================================
  build-and-push-frontend:
    name: Build & Push Frontend
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD JOB 3: DEPLOY TO PRODUCTION VPS & ROLLBACK
  # ==========================================
  deploy-to-vps:
    name: Deploy to Production VPS
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 10601 }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export DOCKER_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ github.sha }}"
            cd /var/www/HumanResources
            git fetch origin main && git checkout -f origin/main
            bash deploy/deploy-production.sh
