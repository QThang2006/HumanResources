name: Build, Push and Deploy HR Enterprise (Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # CI GATE 1: BACKEND CI (Build & Test)
  # ==========================================
  ci-backend:
    name: Backend CI (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run Backend Tests (Includes Build)
        run: cd backend && npm test

  # ==========================================
  # CI GATE 2: FRONTEND CI (Lint, Test & Build)
  # ==========================================
  ci-frontend:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Run Frontend Tests
        run: cd frontend && npm test

      - name: Build Frontend Application
        run: cd frontend && npm run build

  # ==========================================
  # CD JOB 1: BUILD & PUSH BACKEND DOCKER IMAGE
  # ==========================================
  build-and-push-backend:
    name: Build & Push Backend Image
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD JOB 2: BUILD & PUSH FRONTEND DOCKER IMAGE
  # ==========================================
  build-and-push-frontend:
    name: Build & Push Frontend Image
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD JOB 3: DEPLOY PURE DOCKER TO VPS & AUTO-ROLLBACK
  # ==========================================
  deploy-to-vps:
    name: Deploy Pure Docker to VPS
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Versioned Images & Package Archive
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${IMAGE_TAG}"

          docker pull "${BACKEND_IMAGE}"
          docker pull "${FRONTEND_IMAGE}"

          echo "📦 Đang đóng gói 2 Docker Images (${IMAGE_TAG})..."
          docker save "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}" | gzip > /tmp/hr-images.tar.gz
          ls -lh /tmp/hr-images.tar.gz

      - name: Transfer Docker Images & Deploy on VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '10601' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-i ~/.ssh/deploy_key -p ${VPS_PORT} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          SCP_OPTS="-i ~/.ssh/deploy_key -P ${VPS_PORT} -o StrictHostKeyChecking=no"

          echo "📤 Đang đẩy cấu hình Docker Compose & Script Deploy lên VPS..."
          ssh ${SSH_OPTS} "${VPS_USERNAME}@${VPS_HOST}" "mkdir -p /var/www/HumanResources/deploy/nginx"
          scp ${SCP_OPTS} docker-compose.app.yml "${VPS_USERNAME}@${VPS_HOST}:/var/www/HumanResources/docker-compose.app.yml"
          scp ${SCP_OPTS} deploy/deploy-production.sh "${VPS_USERNAME}@${VPS_HOST}:/var/www/HumanResources/deploy/deploy-production.sh"
          scp ${SCP_OPTS} deploy/nginx/hr-enterprise.conf "${VPS_USERNAME}@${VPS_HOST}:/var/www/HumanResources/deploy/nginx/hr-enterprise.conf"

          echo "📤 Đang đẩy gói Docker Images (/tmp/hr-images.tar.gz) lên VPS..."
          scp ${SCP_OPTS} /tmp/hr-images.tar.gz "${VPS_USERNAME}@${VPS_HOST}:/tmp/hr-images.tar.gz"

          echo "🚀 Đang kích hoạt Deploy Thuần Docker + Health Check + Auto-Rollback trên VPS..."
          ssh ${SSH_OPTS} "${VPS_USERNAME}@${VPS_HOST}" \
            "chmod +x /var/www/HumanResources/deploy/deploy-production.sh && DOCKER_USERNAME='${DOCKER_USERNAME}' IMAGE_TAG='${IMAGE_TAG}' IMAGES_ARCHIVE='/tmp/hr-images.tar.gz' bash /var/www/HumanResources/deploy/deploy-production.sh"
