name: Build, Push and Deploy HR Enterprise (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # CI GATE 1: BACKEND CI (Lint, Type Check, Test & Build)
  # ==========================================
  ci-backend:
    name: Backend CI (Lint, Type Check, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Lint Backend
        run: cd backend && npm run lint

      - name: Type Check Backend
        run: cd backend && npm run typecheck

      - name: Run Backend Tests (Includes Build)
        run: cd backend && npm test

  # ==========================================
  # CI GATE 2: FRONTEND CI (Lint, Test, Type Check & Build)
  # ==========================================
  ci-frontend:
    name: Frontend CI (Lint, Test, Type Check & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Run Frontend Tests
        run: cd frontend && npm test

      - name: Type Check & Build Frontend
        run: cd frontend && npm run build

  # ==========================================
  # SECURITY GATE: SECRET SCAN (GITLEAKS) & DEPENDENCY SCAN (TRIVY)
  # ==========================================
  security-check:
    name: Security Check (Gitleaks & Trivy)
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks - Block on Leaked Secrets)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

      - name: Trivy Filesystem & Dependency Scan (Table Report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Filesystem Scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy FS Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  # ==========================================
  # CD JOB 1: BUILD, PUSH & SCAN BACKEND DOCKER IMAGE
  # ==========================================
  build-and-push-backend:
    name: Build, Push & Scan Backend Image
    needs: [security-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan Backend Docker Image (Table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Scan Backend Docker Image (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Backend Image Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-backend-image.sarif'
          category: 'trivy-image-backend'

  # ==========================================
  # CD JOB 2: BUILD, PUSH & SCAN FRONTEND DOCKER IMAGE
  # ==========================================
  build-and-push-frontend:
    name: Build, Push & Scan Frontend Image
    needs: [security-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan Frontend Docker Image (Table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Scan Frontend Docker Image (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Frontend Image Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend-image.sarif'
          category: 'trivy-image-frontend'

  # ==========================================
  # CD JOB 3: DEPLOY PURE DOCKER TO VPS (1 SINGLE SSH CONNECTION)
  # ==========================================
  deploy-to-vps:
    name: Deploy Pure Docker to VPS
    needs: [build-and-push-backend, build-and-push-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Versioned Images & Package Single Deploy Archive
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hr-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hr-frontend:${IMAGE_TAG}"

          docker pull "${BACKEND_IMAGE}"
          docker pull "${FRONTEND_IMAGE}"

          echo "📦 Đang đóng gói 2 Docker Images (${IMAGE_TAG})..."
          docker save "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}" | gzip > /tmp/hr-images.tar.gz

          echo "📦 Gộp cấu hình + 2 Docker Images vào 1 gói duy nhất..."
          tar -cf /tmp/deploy-all.tar \
            docker-compose.app.yml \
            deploy/deploy-production.sh \
            deploy/nginx/hr-enterprise.conf \
            -C /tmp hr-images.tar.gz
          ls -lh /tmp/deploy-all.tar

      - name: Stream Package & Deploy via Single SSH Connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '10601' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "🚀 Mở 1 kết nối SSH duy nhất để truyền Docker Images & Deploy..."
          cat /tmp/deploy-all.tar | ssh \
            -i ~/.ssh/deploy_key \
            -p "${VPS_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "${VPS_USERNAME}@${VPS_HOST}" \
            "set -euo pipefail
             mkdir -p /var/www/HumanResources/deploy/nginx
             tar -xf - --no-same-owner -C /var/www/HumanResources
             mv /var/www/HumanResources/hr-images.tar.gz /tmp/hr-images.tar.gz
             chmod +x /var/www/HumanResources/deploy/deploy-production.sh
             DOCKER_USERNAME='${DOCKER_USERNAME}' IMAGE_TAG='${IMAGE_TAG}' IMAGES_ARCHIVE='/tmp/hr-images.tar.gz' \
               bash /var/www/HumanResources/deploy/deploy-production.sh </dev/null"
