# ========================================================
# 🏢 HR ENTERPRISE ECOSYSTEM - PRODUCTION NGINX CONFIG
# ========================================================

server {
    listen 80 default_server;
    # VPS NAT chỉ dùng IPv4, không kích hoạt IPv6
    server_name _;

    # Giới hạn kích thước file upload (dành cho CV PDF, tài liệu nhân sự)
    client_max_body_size 25M;

    # 1. Phục vụ Frontend React (SPA)
    root /var/www/HumanResources/frontend/dist;
    index index.html;

    # Bật Gzip nén các file tĩnh giúp tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache tài nguyên tĩnh (JS, CSS, Font, Ảnh)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Hỗ trợ định tuyến React Router (tránh lỗi 404 khi tải lại trang)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Chuyển tiếp API về Backend NestJS (cổng 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Hỗ trợ WebSockets & Streaming phản hồi AI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout lên 120s cho các tác vụ phân tích AI và chấm điểm CV
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;

        proxy_cache_bypass $http_upgrade;
    }

    # 3. Chuyển tiếp Webhook tới n8n Automation Engine (cổng 5678)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678/webhook/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
