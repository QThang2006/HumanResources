# ========================================================
# 🏢 HR ENTERPRISE ECOSYSTEM - PRODUCTION NGINX CONFIG
# ========================================================

server {
    listen 80 default_server;
    # VPS NAT chỉ dùng IPv4, không kích hoạt IPv6
    server_name _;

    # Giới hạn kích thước file upload (dành cho CV PDF, tài liệu nhân sự)
    client_max_body_size 25M;

    # 1. Chuyển tiếp giao diện React tới Frontend Docker Container (cổng 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Chuyển tiếp API về Backend NestJS (cổng 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Hỗ trợ WebSockets & Streaming phản hồi AI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout lên 120s cho các tác vụ phân tích AI và chấm điểm CV
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;

        proxy_cache_bypass $http_upgrade;
    }

    # 3. Chuyển tiếp Webhook tới n8n Automation Engine (cổng 5678)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678/webhook/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
