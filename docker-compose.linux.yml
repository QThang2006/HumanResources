services:
  # 1. Cơ sở dữ liệu MySQL 8.0 cho Linux Demo (Khớp 100% cấu hình backend/.env)
  mysql:
    image: mysql:8.0
    container_name: hr_mysql_linux
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hr_enterprise_db
    ports:
      - "3306:3306"
    volumes:
      - ./sql_linux_ready:/docker-entrypoint-initdb.d
      - mysql_linux_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+07:00

  # 2. n8n Automation Engine - Mount sẵn toàn bộ 9 Workflows V5 Ultra & Credentials
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hr_n8n_linux
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_ENCRYPTION_KEY=hHPke5fW+P7vxbBe6dytqsNw7VD2YWH3
    volumes:
      - ./n8n_linux_backup:/home/node/.n8n

volumes:
  mysql_linux_data:
    driver: local
