services:
  # 1. Cơ sở dữ liệu MySQL 8.0 (Dành cho thành viên chạy DB trên Docker)
  # Lưu ý: Cổng được map ra 3307 để tránh xung đột với MySQL 3306 cài sẵn trên máy Windows
  mysql:
    image: mysql:8.0
    container_name: hr_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hr_enterprise_db
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. n8n Automation Engine (Điều phối quy trình AI & Gửi mail, lịch)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hr_n8n
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_EDITOR_BASE_URL=https://trek-coordinator-them-alternative.trycloudflare.com/
      - WEBHOOK_URL=https://trek-coordinator-them-alternative.trycloudflare.com/
      - N8N_WEBHOOK_URL=https://trek-coordinator-them-alternative.trycloudflare.com/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - ./backend/.env
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  mysql_data:
    driver: local
  n8n_data:
    driver: local
